name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 【核心新增】：在这里自动将你的大写用户名转为全小写，存入环境变量
      - name: Convert owner to lowercase
        run: |
          echo "OWNER_LOWERCASE=${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 【核心修改】：视频里原本是 github.repository_owner，现在改用上面转换好的全小写 env.OWNER_LOWERCASE
          tags: |
            ghcr.io/${{ env.OWNER_LOWERCASE }}/dcdeploy0034:latest

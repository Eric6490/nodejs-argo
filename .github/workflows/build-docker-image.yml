name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 【改用官方脚本进行转换】：绝对稳定，不会出现变量丢失或变空的情况
      - name: Convert owner to lowercase
        id: get_owner
        uses: actions/github-script@v7
        with:
          script: |
            return context.repo.owner.toLowerCase()
          result-encoding: string

      # 测试打印一下转换后的结果，方便在日志里排查
      - name: Test Output
        run: echo "The lowercase owner is ${{ steps.get_owner.outputs.result }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 【更新这里的变量读取方式】：改用上面 steps.get_owner 的输出结果
          tags: |
            ghcr.io/${{ steps.get_owner.outputs.result }}/dcdeploy0034:latest
